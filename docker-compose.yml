# `docker compose up` brings up the whole stack:
#   gateway      http://localhost:8000   (playground at /, API at /v1/chat/completions)
#   grafana      http://localhost:3000   (anonymous viewer access, Bulwark dashboard is home)
#   jaeger       http://localhost:16686  (traces)
#   prometheus   http://localhost:9090
services:
  gateway:
    build: .
    image: bulwark-gateway:latest
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      DB_PATH: /data/gateway.db
      # Guard concurrency; 0 = auto-size from CPU count (gateway/config.py, docs/DECISIONS.md)
      GUARD_WORKERS: ${GUARD_WORKERS:-0}
      CLASSIFIER_THREADS: ${CLASSIFIER_THREADS:-0}
    volumes:
      - gateway-data:/data
      # Optional judge (3 GB, not baked into the image): `make judge-model` fills this folder.
      # If it's empty, the gateway runs without the judge.
      - ./models/judge:/app/models/judge:ro
    depends_on: [otel-collector]
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on: [jaeger]

  jaeger:
    image: jaegertracing/jaeger:2.23.0
    ports: ["16686:16686"]

  prometheus:
    image: prom/prometheus:v3.16.0
    ports: ["9090:9090"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:13.2.5
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/bulwark.json
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, jaeger]

volumes:
  gateway-data:
