[project]
name = "bulwark-gateway"
version = "0.1.0"
description = "Bulwark: a drop-in LLM security gateway that blocks prompt injection, redacts PII, and shows what happened to every request."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "anthropic>=0.40",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "onnxruntime>=1.31.1",
    "tokenizers>=0.23.3",
    "huggingface-hub>=2.4.0",
    "numpy>=2.5.4",
    "presidio-analyzer>=2.2.362",
    "presidio-anonymizer>=2.2.366",
    "spacy>=3.8.18",
    "en-core-web-lg",
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "prometheus-client>=0.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "httpx>=0.27",
    "openai>=1.50",
    "pyarrow>=26.0.1",
    "matplotlib>=3.11.2",
    "plotly>=7.1.0",
    "playwright>=1.64.1",
    "locust==2.47.0",
]

[tool.uv]
package = false

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
